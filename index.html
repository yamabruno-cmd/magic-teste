<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha coleção de Magic</title>
<style>
:root{--bg:#14161c;--card:#1f2330;--txt:#e8e8ec;--mut:#8b90a0;--acc:#c9a227;--line:#2c3142}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:14px 18px;border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0 0 10px}
.linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
input[type=text]{min-width:160px}
button{cursor:pointer}
button.pri{background:var(--acc);color:#111;border:none;font-weight:600}
.filtros{padding:10px 18px}
.stats{display:flex;gap:16px;padding:0 18px 10px;color:var(--mut);font-size:14px;flex-wrap:wrap}
.stats b{color:var(--txt)}
#msg{padding:0 18px 8px;color:var(--mut);font-size:13px;min-height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 18px 40px}
.c{background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--line);position:relative}
.c img{width:100%;display:block;aspect-ratio:488/680;object-fit:cover;background:#000}
.ph{aspect-ratio:488/680;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;background:#000}
.info{padding:7px 9px;font-size:12px}
.pt{font-weight:600;line-height:1.25}
.en{color:var(--mut);font-size:11px;margin-top:2px}
.meta{color:var(--mut);font-size:11px;margin-top:5px;line-height:1.5}
.preco{margin-top:5px;font-weight:600;color:var(--acc)}
.badge{position:absolute;top:6px;right:6px;background:linear-gradient(135deg,#f5d76e,#c48bff,#6ee7f9);color:#111;font-size:10px;font-weight:700;padding:2px 5px;border-radius:5px}
.qtd{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.75);font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;border:1px solid #0008;vertical-align:middle}
.mais{grid-column:1/-1;justify-self:center}
</style>
</head>
<body>
<header>
  <h1>Minha coleção de Magic</h1>
  <div class="linha">
    <label>USD → BRL: <input type="text" id="cambio" value="5.50" style="width:70px"></label>
    <button id="btnPrecos" class="pri">Atualizar preços</button>
  </div>
</header>

<div class="filtros linha">
  <input type="text" id="busca" placeholder="Buscar nome (PT ou EN)">
  <select id="cor">
    <option value="">Todas as cores</option>
    <option value="W">Branco</option><option value="U">Azul</option>
    <option value="B">Preto</option><option value="R">Vermelho</option>
    <option value="G">Verde</option><option value="M">Multicolor</option>
    <option value="C">Incolor</option>
  </select>
  <select id="acab">
    <option value="">Normal e foil</option>
    <option value="normal">Só normal</option>
    <option value="foil">Só foil</option>
  </select>
  <select id="ed"><option value="">Todas as edições</option></select>
  <select id="ordem">
    <option value="nome">Ordenar: nome</option>
    <option value="valor">Ordenar: maior valor</option>
    <option value="pago">Ordenar: maior preço pago</option>
  </select>
</div>

<div class="stats" id="stats"></div>
<div id="msg"></div>
<div class="grid" id="grid"></div>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cambio=()=>parseFloat($('cambio').value.replace(',','.'))||5.5;
const brl=v=>v==null?'—':'R$ '+v.toFixed(2).replace('.',',');
const isFoil=c=>c.acab==='Foil'||c.acab==='Etched Foil';
const chave=c=>`${c.sigla}|${c.num}|${c.en}`;

function normalizar(r){
  const mercado=parseFloat((r['Valor de Mercado']||'').replace(',','.'));
  return {
    pt:r['Nome em Português']||r['Nome em Inglês'],
    en:r['Nome em Inglês'],
    qtd:parseInt(r['Quantidade'])||1,
    edicao:r['Edição'],
    sigla:r['Sigla da Edição'],
    num:r['Número de Colecionador'],
    idioma:r['Idioma'],
    qual:r['Qualidade'],
    acab:r['Acabamento'],
    variante:r['Variante'],
    pago:parseFloat((r['Preço Pago']||'0').replace(',','.'))||0,
    mercado:isNaN(mercado)?null:mercado,
    scry:null   // {colors, prices} preenchido ao atualizar
  };
}

/* ---------- Scryfall (só ao clicar em Atualizar) ---------- */
async function consultar(identificadores,rotulo){
  const achados=[];
  const total=Math.ceil(identificadores.length/75);
  for(let i=0,n=1;i<identificadores.length;i+=75,n++){
    $('msg').textContent=`Buscando ${rotulo} (lote ${n} de ${total})...`;
    const r=await fetch('https://api.scryfall.com/cards/collection',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({identifiers:identificadores.slice(i,i+75)})
    });
    if(!r.ok) throw new Error('Scryfall respondeu '+r.status);
    const j=await r.json();
    achados.push(...(j.data||[]));
    await new Promise(s=>setTimeout(s,120));
  }
  return achados;
}

const dadoResumido=d=>({colors:d.colors||d.card_faces?.[0]?.colors||[],prices:d.prices||{}});

async function atualizarPrecos(){
  $('btnPrecos').disabled=true;
  try{
    const comSet=cartas.filter(c=>c.sigla&&c.num);
    const d1=await consultar(comSet.map(c=>({set:c.sigla.toLowerCase(),collector_number:c.num})),'versões exatas');
    const m1={};
    for(const d of d1) m1[`${d.set}|${d.collector_number}`]=dadoResumido(d);
    for(const c of cartas) c.scry=m1[`${(c.sigla||'').toLowerCase()}|${c.num}`]||null;

    const semMatch=cartas.filter(c=>!c.scry);
    const nomes=[...new Set(semMatch.map(c=>c.en))].filter(Boolean);
    if(nomes.length){
      const d2=await consultar(nomes.map(name=>({name})),'pelo nome');
      const m2={};
      for(const d of d2){
        const r=dadoResumido(d);
        m2[d.name.toLowerCase()]=r;
        const f=d.name.split(' // ')[0].toLowerCase();
        if(!m2[f]) m2[f]=r;
      }
      for(const c of semMatch) c.scry=m2[c.en.toLowerCase()]||m2[c.en.split(' // ')[0].toLowerCase()]||null;
    }
    salvarCache();
    render(false);
    const sem=cartas.filter(c=>!c.scry).length;
    $('msg').textContent=`Preços atualizados em ${agora()}`+(sem?` (${sem} cartas sem correspondência).`:'.');
  }catch(e){
    $('msg').textContent='Não consegui atualizar: '+e.message+'. Os últimos preços salvos continuam aparecendo.';
  }finally{
    $('btnPrecos').disabled=false;
  }
}

/* ---------- Cache local (último preço salvo no navegador) ---------- */
function salvarCache(){
  const itens={};
  for(const c of cartas) if(c.scry) itens[chave(c)]=c.scry;
  localStorage.setItem(CHAVE_CACHE,JSON.stringify({ts:Date.now(),itens}));
  localStorage.setItem(CHAVE_CACHE+'-ts',String(Date.now()));
}
function carregarCache(){
  try{
    const j=JSON.parse(localStorage.getItem(CHAVE_CACHE)||'null');
    if(!j) return null;
    for(const c of cartas) c.scry=j.itens[chave(c)]||null;
    return j.ts;
  }catch(e){ return null; }
}
const agora=()=>new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});

/* ---------- Preço e cores ---------- */
const coresDe=c=>c.scry?c.scry.colors||[]:[];
function precoBRL(c){
  if(c.mercado!=null) return c.mercado;
  if(!c.scry) return null;
  const p=c.scry.prices||{};
  const usd=c.acab==='Etched Foil'?p.usd_etched:isFoil(c)?p.usd_foil:p.usd;
  return usd?parseFloat(usd)*cambio():null;
}

/* ---------- Filtros e exibição ---------- */
function filtrados(){
  const b=$('busca').value.trim().toLowerCase();
  const cor=$('cor').value, acab=$('acab').value, ed=$('ed').value;
  const l=cartas.filter(c=>{
    if(b&&!(c.pt+' '+c.en).toLowerCase().includes(b)) return false;
    if(ed&&c.edicao!==ed) return false;
    if(acab==='foil'&&!isFoil(c)) return false;
    if(acab==='normal'&&isFoil(c)) return false;
    if(cor){
      const cs=coresDe(c);
      if(cor==='C'&&cs.length) return false;
      if(cor==='M'&&cs.length<2) return false;
      if('WUBRG'.includes(cor)&&!cs.includes(cor)) return false;
    }
    return true;
  });
  const ord=$('ordem').value;
  const valor=c=>(precoBRL(c)||0)*c.qtd;
  l.sort((a,b)=>
    ord==='valor'?valor(b)-valor(a):
    ord==='pago'?b.pago-a.pago:
    a.pt.localeCompare(b.pt,'pt'));
  return l;
}

const urlImagem=c=>c.sigla&&c.num
  ?`https://api.scryfall.com/cards/${c.sigla.toLowerCase()}/${encodeURIComponent(c.num)}?format=image&version=small`
  :`https://api.scryfall.com/cards/named?exact=${encodeURIComponent(c.en)}&format=image&version=small`;
const urlImagemNome=c=>`https://api.scryfall.com/cards/named?exact=${encodeURIComponent(c.en)}&format=image&version=small`;

function cartaHTML(c){
  const cs=coresDe(c);
  const bolinhas=cs.length
    ?cs.map(x=>`<span class="dot" style="background:${COR[x]}"></span>`).join('')
    :(c.scry?'<span class="dot" style="background:#aaa"></span>':'');
  const u=precoBRL(c);
  return `<div class="c">
    <span class="qtd">×${c.qtd}</span>
    ${isFoil(c)?'<span class="badge">FOIL</span>':''}
    <img loading="lazy" decoding="async" src="${esc(urlImagem(c))}" alt="${esc(c.en)}">
    <div class="info">
      <div class="pt">${esc(c.pt)}</div>
      <div class="en">${esc(c.en)}</div>
      <div class="meta">${bolinhas} ${esc(c.edicao)} · ${esc(c.sigla)} #${esc(c.num)}<br>
        ${esc(c.idioma)} · ${esc(c.qual)}${c.variante&&c.variante!=='Regular'?' · '+esc(c.variante):''}</div>
      <div class="preco">${u!=null?brl(u*c.qtd)+` <span class="meta">(${brl(u)} un.)</span>`:'sem preço'}</div>
      <div class="meta">Pago: ${brl(c.pago*c.qtd)}</div>
    </div>
  </div>`;
}

function render(reset){
  if(reset) limite=PAGINA;
  const l=filtrados();
  const qtd=l.reduce((s,c)=>s+c.qtd,0);
  const mercado=l.reduce((s,c)=>s+(precoBRL(c)||0)*c.qtd,0);
  const pago=l.reduce((s,c)=>s+c.pago*c.qtd,0);
  $('stats').innerHTML=`<span>Cartas: <b>${qtd}</b></span>
    <span>Valor de mercado: <b>${brl(mercado)}</b></span>
    <span>Total pago: <b>${brl(pago)}</b></span>`;
  const botao=l.length>limite?`<button class="pri mais" id="mais">Mostrar mais (${l.length-limite} restantes)</button>`:'';
  $('grid').innerHTML=l.slice(0,limite).map(cartaHTML).join('')+botao;
}

function preencherEdicoes(){
  const eds=[...new Set(cartas.map(c=>c.edicao).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt'));
  $('ed').innerHTML='<option value="">Todas as edições</option>'+eds.map(e=>`<option>${esc(e)}</option>`).join('');
}

/* ---------- Inicialização ---------- */
cartas=DADOS.map(normalizar);
preencherEdicoes();
const ultimo=carregarCache();
render(true);
$('msg').textContent=ultimo
  ?`Preços de ${new Date(ultimo).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}. Clique em "Atualizar preços" para buscar valores novos.`
  :'Clique em "Atualizar preços" para buscar os preços e as cores das cartas.';

// Se a miniatura pela edição não existir, tenta pelo nome; se ainda falhar, mostra o aviso
$('grid').addEventListener('error',e=>{
  const img=e.target;
  if(img.tagName!=='IMG') return;
  if(!img.dataset.tent){ img.dataset.tent='1'; img.src=urlImagemNome(cartas.find(c=>c.en===img.alt)||{en:img.alt}); return; }
  const div=document.createElement('div');
  div.className='ph'; div.textContent='sem imagem';
  img.replaceWith(div);
},true);

$('btnPrecos').addEventListener('click',atualizarPrecos);
$('grid').addEventListener('click',e=>{
  if(e.target.id==='mais'){ limite+=PAGINA; render(false); }
});
['busca','cor','acab','ed','ordem','cambio'].forEach(id=>$(id).addEventListener('input',()=>render(true)));
</script>

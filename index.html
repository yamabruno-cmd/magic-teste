<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Minha coleção de Magic</title>
<style>
:root{--bg:#0f1117;--panel:#171a24;--card:#1e2230;--line:#2a2f3f;--txt:#eceef4;--mut:#8a90a2;--acc:#c9a227;--acc2:#e6c451}
*{box-sizing:border-box}
body{margin:0;font-family:'Montserrat',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt)}
button,input,select{font:inherit}
input,select{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
button{cursor:pointer}
.pri{background:var(--acc);color:#111;border:none;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px}
.pri:hover{background:var(--acc2)}
.pri:disabled{opacity:.6;cursor:default}

/* barra superior */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--acc),#8a5cff);display:grid;place-items:center;color:#111;font-weight:800;font-size:18px}
.brand h1{font-size:18px;margin:0;letter-spacing:.2px}
.brand small{color:var(--mut);font-size:12px}
.acoes{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cor-header{display:flex;align-items:center}
.acoes-filtro{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.linha.acima{justify-content:flex-end}
.cor-header .rotulo{display:none}
.cor-header .chips{gap:6px}
.cor-header .chip{width:28px;height:28px;font-size:11px}
.cambio{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
.cambio input{width:72px;text-align:center}

/* filtros */
.toolbar{padding:18px 24px 6px;display:grid;gap:14px}
.linha{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.busca{flex:1;min-width:240px}
.busca input{width:100%}
.grupo{display:flex;flex-direction:column;gap:6px}
.rotulo{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);color:#111;font-weight:700;font-size:12px;display:grid;place-items:center;padding:0}
.chip.ativo{outline:2px solid var(--acc);outline-offset:2px}
.chip.todas{background:var(--card);color:var(--txt);font-size:11px}

/* resumo */
.metricas{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:12px 24px 4px}
.metrica{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.metrica span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.metrica b{display:block;font-size:22px;margin-top:6px;font-weight:700}
.metrica.destaque b{color:var(--acc2)}
.aviso{padding:6px 24px 0;color:#e5a13b;font-size:13px}
#msg{padding:8px 24px 0;color:var(--mut);font-size:13px;min-height:20px}

/* grade */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:14px 24px 48px}
.c{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative;transition:transform .15s,border-color .15s}
.c:hover{transform:translateY(-2px);border-color:#3a4158}
.c img{width:100%;display:block;aspect-ratio:488/680;object-fit:cover;background:#000}
.ph{aspect-ratio:488/680;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;background:#000}
.info{padding:9px 10px;font-size:12px}
.pt{font-weight:600;line-height:1.25}
.en{color:var(--mut);font-size:11px;margin-top:2px}
.meta{color:var(--mut);font-size:11px;margin-top:6px;line-height:1.5}
.preco{margin-top:6px;font-weight:700;color:var(--acc2)}
.badge{position:absolute;top:8px;right:8px;background:linear-gradient(135deg,#f5d76e,#c48bff,#6ee7f9);color:#111;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px}
.qtd{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.75);font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;border:1px solid #0008;vertical-align:middle}
.mais{grid-column:1/-1;justify-self:center;padding:10px 22px}
[hidden]{display:none!important}
.abas{display:flex;gap:4px;padding:8px 24px 0;border-bottom:1px solid var(--line);background:var(--bg)}
.aba{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:10px 14px;font-size:14px;border-radius:0}
.aba.ativo{color:var(--txt);border-bottom-color:var(--acc)}
.hist{padding:18px 24px 48px;display:grid;gap:14px}
.hist-controles{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.hist-controles select{min-width:320px}
#histResumo{padding:0}
.grafico{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.grafico svg{display:block;height:auto}
.legenda{display:flex;gap:16px;color:var(--mut);font-size:12px;margin-top:8px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.aviso-h{color:var(--mut);font-size:13px;margin:0}
.decks{display:grid;grid-template-columns:260px 1fr;gap:18px;padding:18px 24px 48px;align-items:start}
@media(max-width:800px){.decks{grid-template-columns:1fr}}
.deck-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.deck-item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;color:var(--txt)}
.deck-item.ativo{border-color:var(--acc)}
.deck-item small{display:block;color:var(--mut);font-size:11px;margin-top:3px}
.deck-editor{display:grid;gap:14px;min-width:0}
.deck-cartas{display:grid;gap:8px}
.deck-linha{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dl-info{flex:1;min-width:0}
.dl-info small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.tenho{color:#6fd08c}
.falta{color:#e5a13b}
.dl-qtd{display:flex;align-items:center;gap:6px}
.dl-qtd button,.x{width:30px;height:30px;padding:0;border-radius:8px}
.importar summary{cursor:pointer;color:var(--mut);margin-bottom:8px}
.importar textarea{width:100%;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.importar .pri{margin-top:8px}
.exportar{display:flex;gap:8px;flex-wrap:wrap}
.perigo{color:#e5573b}
.metrica.alerta{border-color:#e5573b}
.metrica.alerta b{color:#e5573b}
.analise{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.painel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.painel h3{margin:0 0 4px;font-size:14px}
.painel .nota{color:var(--mut);font-size:12px;margin:0 0 10px}
.bar-row{display:grid;grid-template-columns:70px 1fr 56px;gap:8px;align-items:center;font-size:12px;margin:6px 0}
.bar-track{background:#262b3a;border-radius:6px;height:14px;overflow:hidden}
.bar-fill{height:100%;background:var(--acc);border-radius:6px}
.bar-val{color:var(--mut);text-align:right}
.resumo-odds{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-bottom:10px}
.thumb{width:44px;height:62px;object-fit:cover;border-radius:5px;background:#000;flex:none}
.visao{display:flex;gap:4px;justify-content:flex-end}
.visao button{background:none;border:1px solid var(--line);color:var(--mut);padding:6px 12px;border-radius:8px;font-size:13px}
.visao button.ativo{background:var(--acc);border-color:var(--acc);color:#111;font-weight:600}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tile img{width:100%;display:block;aspect-ratio:488/680;object-fit:cover;background:#000}
.tile-qtd{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.75);font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px}
.tile-falta{position:absolute;top:6px;right:6px;background:#e5a13b;color:#111;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px}
.tile-ok{position:absolute;top:6px;right:6px;background:#3fa35b;color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px}
.tile-botoes{display:flex;justify-content:center;gap:6px;padding:6px}
.tile-botoes button{width:30px;height:28px;padding:0;border-radius:8px}
.preview{position:fixed;z-index:50;pointer-events:none;width:260px;border-radius:14px;overflow:hidden;box-shadow:0 12px 32px #000c}
.preview img{width:100%;display:block}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">M</div>
    <div><h1>Coleção Magic</h1><small>Estoque Yamamoto</small></div>
  </div>
  <div class="cor-header">
    <div class="grupo"><span class="rotulo">Cor</span>
      <div class="chips" id="chips">
        <button class="chip todas ativo" data-v="" title="Todas">T</button>
        <button class="chip" data-v="W" style="background:#f8f6d8">W</button>
        <button class="chip" data-v="U" style="background:#4fa3e0">U</button>
        <button class="chip" data-v="B" style="background:#6b6b6b;color:#fff">B</button>
        <button class="chip" data-v="R" style="background:#e5573b;color:#fff">R</button>
        <button class="chip" data-v="G" style="background:#3fa35b;color:#fff">G</button>
        <button class="chip" data-v="M" style="background:linear-gradient(135deg,#f8f6d8,#4fa3e0,#e5573b,#3fa35b)">M</button>
        <button class="chip" data-v="C" style="background:#aaa">C</button>
      </div></div>
  </div>

</header>

<nav class="abas">
  <button class="aba ativo" data-aba="colecao">Coleção</button>
  <button class="aba" data-aba="historico">Histórico de preço</button>
  <button class="aba" data-aba="decks">Decklists</button>
</nav>

<main id="aba-colecao">
<section class="toolbar">
  <div class="linha acima">
    <div class="acoes-filtro">
      <label class="cambio">USD → BRL <input type="text" id="cambio" value="5.50"></label>
      <button id="btnPrecos" class="pri">Atualizar preços</button>
    </div>
  </div>
  <div class="linha">
    <div class="busca"><input type="text" id="busca" placeholder="Buscar por nome em português ou inglês"></div>
    <div class="grupo"><span class="rotulo">Edição</span>
      <select id="ed"><option value="">Todas</option></select></div>
    <div class="grupo"><span class="rotulo">Ordenar por</span>
      <select id="ordem">
        <option value="pt">Nome (PT)</option>
        <option value="en">Nome (EN)</option>
        <option value="pago">Menor preço pago</option>
        <option value="preco">Menor preço de mercado</option>
        <option value="valor">Maior valor total</option>
      </select></div>
  </div>
  <div class="linha">
    <div class="grupo"><span class="rotulo">Tipo</span>
      <select id="tipo">
        <option value="">Todos</option>
        <option value="Creature">Criatura</option>
        <option value="Enchantment">Encantamento</option>
        <option value="Instant">Instantâneo</option>
        <option value="Sorcery">Feitiço</option>
        <option value="Artifact">Artefato</option>
        <option value="Planeswalker">Planeswalker</option>
        <option value="Land">Terreno</option>
        <option value="Battle">Batalha</option>
      </select></div>
    <div class="grupo"><span class="rotulo">Formato legal</span>
      <select id="formato">
        <option value="">Todos</option>
        <option value="premodern">Premodern</option>
        <option value="vintage">Vintage</option>
        <option value="pioneer">Pioneer</option>
      </select></div>
    <div class="grupo"><span class="rotulo">Raridade</span>
      <select id="raridade">
        <option value="">Todas</option>
        <option value="common">Comum</option>
        <option value="uncommon">Incomum</option>
        <option value="rare">Rara</option>
        <option value="mythic">Mítica</option>
        <option value="special">Especial</option>
        <option value="bonus">Bônus</option>
      </select></div>
  </div>
  <input type="hidden" id="cor" value="">
</section>

<section class="metricas" id="stats"></section>
<div class="aviso" id="aviso"></div>
<div id="msg"></div>
<div class="grid" id="grid"></div>
</main>

<section id="aba-historico" class="hist" hidden>
  <div class="hist-controles">
    <div class="grupo"><span class="rotulo">Carta</span>
      <select id="histCarta"></select></div>
  </div>
  <div class="metricas" id="histResumo"></div>
  <div class="grafico" id="histGrafico"></div>
  <p class="aviso-h" id="histMsg"></p>
</section>

<section id="aba-decks" class="decks" hidden>
  <aside>
    <div class="deck-topo"><span class="rotulo">Meus decks</span><button id="btnNovoDeck" class="pri">Novo deck</button></div>
    <div id="decksLista"></div>
  </aside>
  <div class="deck-editor" id="deckEditor" hidden>
    <div class="linha">
      <div class="grupo"><span class="rotulo">Nome</span><input type="text" id="deckNome"></div>
      <div class="grupo"><span class="rotulo">Formato</span>
        <select id="deckFormato"><option value="vintage">Value Vintage</option><option value="premodern">Premodern</option></select></div>
      <button id="btnExcluirDeck" class="perigo">Excluir deck</button>
    </div>
    <div class="linha">
      <div class="busca"><input type="text" id="deckBusca" list="sugestoes" placeholder="Buscar carta pelo nome"></div>
      <div class="grupo"><span class="rotulo">Qtd</span><input type="number" id="deckQtd" value="1" min="1" style="width:80px"></div>
      <button id="btnAdicionar" class="pri">Adicionar</button>
    </div>
    <datalist id="sugestoes"></datalist>
    <details class="importar">
      <summary>Importar lista (uma carta por linha, ex.: 4 Lightning Bolt)</summary>
      <textarea id="deckImport" rows="6" placeholder="4 Lightning Bolt&#10;2 Mox Pearl"></textarea>
      <button id="btnImportar" class="pri">Importar</button>
    </details>
    <div class="metricas" id="deckResumo" style="padding:0"></div>
    <div class="exportar">
      <button id="btnCopiarFaltantes">Copiar faltantes</button>
      <button id="btnCopiarTudo">Copiar deck</button>
      <button id="btnBaixar">Baixar .txt</button>
      <button id="btnAtualizarDados">Atualizar dados das cartas</button>
    </div>
    <div class="analise" id="deckAnalise"></div>
    <div class="visao" id="visao">
      <button class="ativo" data-v="lista">Lista</button>
      <button data-v="galeria">Galeria</button>
    </div>
    <div class="deck-cartas" id="deckCartas"></div>
    <p class="aviso-h" id="deckMsg"></p>
  </div>
</section>

<div class="preview" id="preview" hidden><img id="previewImg" alt=""></div>

const PAGINA=60;
const CHAVE_CACHE='mtg-colecao-precos';
let cartas=[], limite=PAGINA;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cambio=()=>parseFloat($('cambio').value.replace(',','.'))||5.5;
const brl=v=>v==null?'—':'R$ '+v.toFixed(2).replace('.',',');
const isFoil=c=>c.acab==='Foil'||c.acab==='Etched Foil';
const chave=c=>`${c.sigla}|${c.num}|${c.en}`;

// aceita "3.0", "3,50", "R$ 3.00" e "R$ 1.234,50"
function numero(s){
  s=String(s||'').replace(/R\$|\s/g,'');
  if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,'').replace(',','.');
  else s=s.replace(',','.');
  const n=parseFloat(s);
  return isNaN(n)?null:n;
}

function normalizar(r){
  const mercado=parseFloat((r['Valor de Mercado']||'').replace(',','.'));
  return {
    pt:r['Nome em Português']||r['Nome em Inglês'],
    en:r['Nome em Inglês'],
    qtd:parseInt(r['Quantidade'])||1,
    edicao:r['Edição'],
    sigla:r['Sigla da Edição'],
    num:r['Número de Colecionador'],
    idioma:r['Idioma'],
    qual:r['Qualidade'],
    acab:r['Acabamento'],
    variante:r['Variante'],
    pago:numero(r['Preço Pago'])||0,
    mercado:isNaN(mercado)?null:mercado,
    cor:r['Cor']||'',
    scry:null   // {prices, colors} preenchido ao atualizar
  };
}

/* ---------- Scryfall (só ao clicar em Atualizar) ---------- */
async function buscarCarta(c){
  const urls=[];
  if(c.sigla&&c.num) urls.push(`https://api.scryfall.com/cards/${c.sigla.toLowerCase()}/${encodeURIComponent(c.num)}`);
  urls.push(`https://api.scryfall.com/cards/named?exact=${encodeURIComponent(c.en)}`);
  for(const u of urls){
    try{
      const r=await fetch(u,{headers:{'Accept':'application/json'}});
      if(r.ok){ const d=await r.json(); return {prices:d.prices||{},colors:d.colors||d.card_faces?.[0]?.colors||[],tipo:d.type_line||d.card_faces?.[0]?.type_line||'',legal:d.legalities||{},raridade:d.rarity||''}; }
    }catch(e){ /* tenta a próxima */ }
  }
  return null;
}

async function atualizarPrecos(){
  $('btnPrecos').disabled=true;
  let ok=0;
  try{
    for(let i=0;i<cartas.length;i++){
      const c=cartas[i];
      $('msg').textContent=`Atualizando preços: ${i+1} de ${cartas.length}...`;
      c.scry=await buscarCarta(c);
      if(c.scry) ok++;
      await new Promise(s=>setTimeout(s,110));   // respeita o limite da Scryfall
      if(i%25===24) render(false);
    }
    salvarCache();
    registrarHistorico();
    render(false);
    $('msg').textContent=ok
      ?`Preços atualizados em ${agora()} (${ok} de ${cartas.length} cartas encontradas).`
      :'Nenhuma carta foi encontrada. Verifique a conexão e tente de novo.';
  }catch(e){
    $('msg').textContent='Erro ao atualizar: '+e.message;
  }finally{
    $('btnPrecos').disabled=false;
  }
}

/* ---------- Cache local (último preço salvo no navegador) ---------- */
function salvarCache(){
  const itens={};
  for(const c of cartas) if(c.scry) itens[chave(c)]=c.scry;
  localStorage.setItem(CHAVE_CACHE,JSON.stringify({ts:Date.now(),itens}));
  localStorage.setItem(CHAVE_CACHE+'-ts',String(Date.now()));
}
function carregarCache(){
  try{
    const j=JSON.parse(localStorage.getItem(CHAVE_CACHE)||'null');
    if(!j) return null;
    for(const c of cartas) c.scry=j.itens[chave(c)]||null;
    return j.ts;
  }catch(e){ return null; }
}
const agora=()=>new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});

/* ---------- Preço e cores ---------- */
const coresDe=c=>c.scry?c.scry.colors||[]:[];
function precoBRL(c){
  if(c.mercado!=null) return c.mercado;
  if(!c.scry) return null;
  const p=c.scry.prices||{};
  const usd=c.acab==='Etched Foil'?p.usd_etched:isFoil(c)?p.usd_foil:p.usd;
  return usd?parseFloat(usd)*cambio():null;
}

function filtrados(){
  const b=$('busca').value.trim().toLowerCase();
  const cor=$('cor').value, ed=$('ed').value, tipo=$('tipo').value, formato=$('formato').value, raridade=$('raridade').value;
  const l=cartas.filter(c=>{
    if(b&&!(c.pt+' '+c.en).toLowerCase().includes(b)) return false;
    if(ed&&c.edicao!==ed) return false;
    if(cor){
      if(!c.scry) return false;           // ainda sem dados da Scryfall
      const cs=coresDe(c);
      if(cor==='C'&&cs.length) return false;
      if(cor==='M'&&cs.length<2) return false;
      if('WUBRG'.includes(cor)&&!cs.includes(cor)) return false;
    }
    if(tipo){
      if(!c.scry) return false;
      if(!(c.scry.tipo||'').includes(tipo)) return false;
    }
    if(raridade){
      if(!c.scry) return false;
      if(c.scry.raridade!==raridade) return false;
    }
    if(formato){
      if(!c.scry) return false;
      if(!['legal','restricted'].includes((c.scry.legal||{})[formato])) return false;
    }
    return true;
  });
  const nulosUltimos=(x,y)=>x==null&&y==null?0:x==null?1:y==null?-1:x-y;
  switch($('ordem').value){
    case 'pt':    l.sort((a,b)=>a.pt.localeCompare(b.pt,'pt')); break;
    case 'en':    l.sort((a,b)=>a.en.localeCompare(b.en,'en')); break;
    case 'pago':  l.sort((a,b)=>nulosUltimos(a.pago||null,b.pago||null)); break;
    case 'preco': l.sort((a,b)=>nulosUltimos(precoBRL(a),precoBRL(b))); break;
    case 'valor': l.sort((a,b)=>(precoBRL(b)||0)*b.qtd-(precoBRL(a)||0)*a.qtd); break;
  }
  return l;
}

function render(reset){

/* ---------- Agrupa a mesma carta em condições diferentes ---------- */
function agrupar(lista){
  const m=new Map();
  for(const c of lista){
    const k=[c.sigla,c.num,c.en,c.acab,c.variante].join('|');
    if(!m.has(k)) m.set(k,{...c,qtd:0,custo:0,condicoes:{},idiomas:{}});
    const g=m.get(k);
    g.qtd+=c.qtd;
    g.custo+=c.pago*c.qtd;
    g.condicoes[c.qual]=(g.condicoes[c.qual]||0)+c.qtd;
    g.idiomas[c.idioma]=(g.idiomas[c.idioma]||0)+c.qtd;
  }
  const junta=o=>Object.entries(o).map(([q,n])=>n>1?`${q} ×${n}`:q).join(' · ');
  return [...m.values()].map(g=>({
    ...g,
    pago:g.qtd?g.custo/g.qtd:0,   // preço médio por unidade
    qual:junta(g.condicoes),
    idioma:junta(g.idiomas)
  }));
}

// grava um ponto por carta por dia (atualizações no mesmo dia substituem o ponto)
function registrarHistorico(){
  const hoje=new Date().toISOString().slice(0,10);
  const h=lerHistorico(), cb=cambio();
  for(const c of cartas){
    if(!c.scry) continue;
    const p=c.scry.prices||{};
    const usd=parseFloat(p.usd), foil=parseFloat(p.usd_foil);
    if(isNaN(usd)&&isNaN(foil)) continue;
    const k=chave(c), lista=h[k]||[];
    const ponto={d:hoje,usd:isNaN(usd)?null:usd,foil:isNaN(foil)?null:foil,cambio:cb};
    const i=lista.findIndex(x=>x.d===hoje);
    if(i>=0) lista[i]=ponto; else lista.push(ponto);
    h[k]=lista;
  }
  localStorage.setItem(CHAVE_HIST,JSON.stringify(h));
}

function grafico(pontos){
  if(!pontos.length) return '<p class="aviso-h">Ainda não há registros para esta carta. Clique em "Atualizar preços" para começar.</p>';
  const W=800,H=300,pad={l:64,r:20,t:20,b:36};
  const t0=Math.min(...pontos.map(p=>dt(p.d))), t1=Math.max(...pontos.map(p=>dt(p.d)));
  const valores=pontos.flatMap(p=>[p.usd!=null?p.usd*p.cambio:null,p.foil!=null?p.foil*p.cambio:null]).filter(v=>v!=null);
  const vmax=(Math.max(...valores)*1.1)||1;
  const x=t=>pad.l+(t1===t0?(W-pad.l-pad.r)/2:(t-t0)/(t1-t0)*(W-pad.l-pad.r));
  const y=v=>H-pad.b-(v/vmax)*(H-pad.t-pad.b);
  const linha=(campo,cor)=>{
    const pts=pontos.filter(p=>p[campo]!=null).map(p=>[x(dt(p.d)),y(p[campo]*p.cambio)]);
    if(!pts.length) return '';
    const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
    return `<path d="${d}" fill="none" stroke="${cor}" stroke-width="2.5"/>`+
      pts.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4" fill="${cor}"/>`).join('');
  };
  const eixo=[0,1,2,3,4].map(i=>{
    const v=vmax*i/4;
    return `<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="#2a2f3f"/>`+
      `<text x="${pad.l-8}" y="${y(v)+4}" text-anchor="end" fill="#8a90a2" font-size="11">${brl(v)}</text>`;
  }).join('');
  const fmt=t=>new Date(t).toLocaleDateString('pt-BR');
  const datas=`<text x="${pad.l}" y="${H-10}" fill="#8a90a2" font-size="11">${fmt(t0)}</text>`+
    `<text x="${W-pad.r}" y="${H-10}" text-anchor="end" fill="#8a90a2" font-size="11">${fmt(t1)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${eixo}${linha('usd','#c9a227')}${linha('foil','#c48bff')}${datas}</svg>
    <div class="legenda"><span><i style="background:#c9a227"></i>Normal</span><span><i style="background:#c48bff"></i>Foil</span></div>`;
}

function renderHistorico(){
  opcoesHistorico();

  const pts=(lerHistorico()[k]||[]).slice().sort((a,b)=>a.d.localeCompare(b.d));
  $('histGrafico').innerHTML=grafico(pts);
  if(!pts.length){
    $('histResumo').innerHTML='';
    $('histMsg').textContent='';
    return;
  }
  const primeiro=pts[0], ultimo=pts[pts.length-1];
  const valor=(p,campo)=>p[campo]!=null?p[campo]*p.cambio:null;
  const var_=primeiro.usd&&ultimo.usd?(ultimo.usd-primeiro.usd)/primeiro.usd*100:null;
  $('histResumo').innerHTML=`
    <div class="metrica"><span>Preço atual (normal)</span><b>${brl(valor(ultimo,'usd'))}</b></div>
    <div class="metrica"><span>Preço atual (foil)</span><b>${brl(valor(ultimo,'foil'))}</b></div>
    <div class="metrica destaque"><span>Variação desde o início</span><b>${var_==null?'—':(var_>=0?'+':'')+var_.toFixed(1).replace('.',',')+'%'}</b></div>
    <div class="metrica"><span>Registros</span><b>${pts.length}</b></div>`;
  $('histMsg').textContent=pts.length<2
    ?'Só há um registro por enquanto. A variação aparece depois de uma atualização em outro dia.'
    :'';
}

// quantas cópias de cada carta (pelo nome em inglês) existem no estoque
function possuidas(){
  const m={};
  for(const c of cartas){ const k=c.en.toLowerCase(); m[k]=(m[k]||0)+c.qtd; }
  return m;
}
function situacao(card,owned){
  const tem=owned[card.nome.toLowerCase()]||0;
  return {tem,falta:Math.max(0,card.qtd-tem)};
}

async function buscarCartaScry(nome){
  const urls=[
    `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(nome)}`,
    `https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(nome)}`
  ];
  for(const u of urls){
    try{
      const r=await fetch(u);
      if(r.ok){
        const d=await r.json();
        const face=d.card_faces?.[0]||{};
        return {nome:d.name,legal:d.legalities||{},usd:parseFloat(d.prices?.usd)||null,
          mv:d.cmc??0,tipo:face.type_line||d.type_line||'',custo:face.mana_cost||d.mana_cost||''};
      }
    }catch(e){ /* tenta a próxima */ }
  }
  return null;
}

async function adicionarCartas(lista){
  const d=deckAtual(); if(!d) return;
  const naoEncontradas=[];
  for(let i=0;i<lista.length;i++){
    const {nome,qtd}=lista[i];
    $('deckMsg').textContent=`Buscando ${i+1} de ${lista.length}: ${nome}`;
    const info=await buscarCartaScry(nome);
    await pausa(110);
    if(!info){ naoEncontradas.push(nome); continue; }
    const ex=d.cartas.find(c=>c.nome.toLowerCase()===info.nome.toLowerCase());
    if(ex){ Object.assign(ex,{qtd:ex.qtd+qtd},info); }
    else d.cartas.push({qtd,...info});
    salvarDecks(); renderDeck();
  }
  $('deckMsg').textContent=naoEncontradas.length
    ?`Não encontrei: ${naoEncontradas.join(', ')}`
    :'Pronto.';
}

// aceita "4 Lightning Bolt", "4x Lightning Bolt" ou só "Lightning Bolt"; ignora o sideboard
function parseLista(texto){
  const itens=[];let principal=true;
  for(const linha0 of texto.split(/\r?\n/)){
    const l=linha0.trim();
    if(!l||l.startsWith('//')) continue;
    if(/^sideboard/i.test(l)){ principal=false; continue; }
    if(!principal) continue;
    const m=l.match(/^(\d+)\s*x?\s+(.+)$/i);
    itens.push(m?{qtd:parseInt(m[1]),nome:m[2].trim()}:{qtd:1,nome:l});
  }
  return itens;
}

function textoDeck(soFaltantes){
  const d=deckAtual(); if(!d) return '';
  const owned=possuidas();
  return d.cartas.map(c=>{
    const q=soFaltantes?situacao(c,owned).falta:c.qtd;
    return q>0?`${q} ${c.nome}`:null;
  }).filter(Boolean).join('\n');
}

async function copiar(texto){
  if(!texto){ $('deckMsg').textContent='Nada para copiar.'; return; }
  try{
    await navigator.clipboard.writeText(texto);
    $('deckMsg').textContent='Copiado. Cole na lista de compra da Liga Magic.';
  }catch(e){
    $('deckMsg').textContent='Não consegui copiar. Use "Baixar .txt".';
  }
}
function baixar(texto,nome){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([texto],{type:'text/plain;charset=utf-8'}));
  a.download=nome;
  a.click();
}

function renderDecks(){
  const ids=Object.keys(decks);
  $('decksLista').innerHTML=ids.length
    ?ids.map(id=>{
        const d=decks[id], n=d.cartas.reduce((s,c)=>s+c.qtd,0);
        return `<button class="deck-item ${id===deckId?'ativo':''}" data-id="${esc(id)}">${esc(d.nome)}<small>${esc(FORMATOS[d.formato]?.nome||'')} · ${n} cartas</small></button>`;
      }).join('')
    :'<p class="aviso-h">Nenhum deck ainda.</p>';
  renderDeck();
}

function renderDeck(){
  const d=deckAtual();
  $('deckEditor').hidden=!d;
  if(!d) return;
  $('deckNome').value=d.nome;
  $('deckFormato').value=d.formato;
  const f=FORMATOS[d.formato];
  const owned=possuidas();
  let total=0, faltaCusto=0, faltaCartas=0, totalCartas=0;
  const linhas=d.cartas.map((c,i)=>{
    const {tem,falta}=situacao(c,owned);
    totalCartas+=c.qtd; faltaCartas+=falta;
    total+=(c.usd||0)*c.qtd; faltaCusto+=(c.usd||0)*falta;
    const legalidadeConhecida=c.legal&&Object.keys(c.legal).length>0;
    const naoLegal=legalidadeConhecida&&!f.ok(c.legal);
    return `<div class="deck-linha">
      <img class="thumb" data-nome="${esc(c.nome)}" loading="lazy" src="${urlCarta(c.nome,'small')}" alt="">
      <div class="dl-info"><b>${esc(c.nome)}</b>
        <small>${falta===0?'<span class="tenho">Tenho</span>':`<span class="falta">Faltam ${falta}</span>`} · possui ${tem}${naoLegal?' · <span class="falta">não legal neste formato</span>':''}</small>
      </div>
      <div class="dl-qtd">
        <button data-act="menos" data-i="${i}">−</button><span>${c.qtd}</span><button data-act="mais" data-i="${i}">+</button>
      </div>
      <button class="x" data-act="remover" data-i="${i}" title="Remover">×</button>
    </div>`;
  }).join('');
  renderAnalise(d);
  const galeria=d.cartas.map((c,i)=>{
    const {falta}=situacao(c,owned);
    return `<div class="tile">
      <img data-nome="${esc(c.nome)}" loading="lazy" src="${urlCarta(c.nome,'small')}" alt="${esc(c.nome)}">
      <span class="tile-qtd">×${c.qtd}</span>
      ${falta?`<span class="tile-falta">faltam ${falta}</span>`:'<span class="tile-ok">✓</span>'}
      <div class="tile-botoes">
        <button data-act="menos" data-i="${i}">−</button><button data-act="mais" data-i="${i}">+</button>
      </div>
    </div>`;
  }).join('');
  $('deckCartas').className=visaoDeck==='galeria'?'galeria':'deck-cartas';
  const vazio='<p class="aviso-h">Adicione cartas pela busca ou importe uma lista.</p>';
  $('deckCartas').innerHTML=(visaoDeck==='galeria'?galeria:linhas)||vazio;
  const acima=f.tetoUSD&&total>f.tetoUSD;
  $('deckResumo').innerHTML=`
    <div class="metrica"><span>Cartas</span><b>${totalCartas}</b></div>
    <div class="metrica"><span>Faltando</span><b>${faltaCartas}</b></div>
    <div class="metrica destaque"><span>Custo para completar</span><b>${brl(faltaCusto*cambio())}</b></div>
    <div class="metrica ${acima?'alerta':''}"><span>Total do deck${f.tetoUSD?` (teto US$ ${f.tetoUSD})`:''}</span><b>${brl(total*cambio())}</b></div>`;
}

/* ---------- Análise do deck ---------- */
const COR_NOME={W:'Branco',U:'Azul',B:'Preto',R:'Vermelho',G:'Verde'};
const COR_HEX={W:'#f8f6d8',U:'#4fa3e0',B:'#6b6b6b',R:'#e5573b',G:'#3fa35b'};

// conta símbolos de cor no custo; híbrido {W/U} conta para as duas cores, Phyrexian {W/P} conta como W
function pipsDe(custo){
  const cnt={W:0,U:0,B:0,R:0,G:0};
  for(const m of (custo||'').matchAll(/\{([^}]+)\}/g)){
    for(const parte of m[1].split('/')){
      const s=parte.replace(/[^WUBRG]/g,'');
      if(s.length===1) cnt[s]++;
    }
  }
  return cnt;
}

// combinações C(n,k), para a distribuição hipergeométrica
function comb(n,k){
  if(k<0||k>n) return 0;
  let r=1;
  for(let i=1;i<=k;i++) r=r*(n-k+i)/i;
  return r;
}

function barra(rotulo,valor,max,texto,cor){
  const w=max?valor/max*100:0;
  return `<div class="bar-row"><span>${rotulo}</span><div class="bar-track"><div class="bar-fill" style="width:${w.toFixed(1)}%;${cor?`background:${cor}`:''}"></div></div><span class="bar-val">${texto}</span></div>`;
}

function renderAnalise(d){
  const ehTerreno=c=>/Land/.test(c.tipo||'');
  const naoTerrenos=d.cartas.filter(c=>!ehTerreno(c));
  const semDados=d.cartas.some(c=>c.mv===undefined);

  // curva de mana (não-terrenos)
  const bal=[0,0,0,0,0,0,0];
  let soma=0, n=0;
  for(const c of naoTerrenos){
    if(c.mv===undefined) continue;
    bal[Math.min(6,Math.floor(c.mv))]+=c.qtd;
    soma+=c.mv*c.qtd; n+=c.qtd;
  }
  const maxB=Math.max(1,...bal);
  const curva=bal.map((q,i)=>barra(i===6?'6+':String(i),q,maxB,String(q))).join('');
  const media=n?(soma/n).toFixed(2).replace('.',','):'—';

  // cores
  const pips={W:0,U:0,B:0,R:0,G:0};
  for(const c of d.cartas){
    const p=pipsDe(c.custo);
    for(const k in p) pips[k]+=p[k]*c.qtd;
  }
  const totalPips=Object.values(pips).reduce((s,v)=>s+v,0);
  const maxP=Math.max(1,...Object.values(pips));
  const cores=['W','U','B','R','G'].map(k=>barra(COR_NOME[k],pips[k],maxP,
    totalPips?Math.round(pips[k]/totalPips*100)+'%':'—',COR_HEX[k])).join('');

  // terrenos na mão (primeiro a jogar: 7 cartas + 1 compra por turno a partir do turno 2)
  const N=d.cartas.reduce((s,c)=>s+c.qtd,0);
  const L=d.cartas.filter(ehTerreno).reduce((s,c)=>s+c.qtd,0);
  const semTerreno=k=>N>=k?comb(N-L,k)/comb(N,k):0;
  const peloMenosUm=k=>1-semTerreno(k);
  const pct=x=>(x*100).toFixed(1).replace('.',',')+'%';
  const dist=[0,1,2,3,4,5,6,7].map(k=>N>=7?comb(L,k)*comb(N-L,7-k)/comb(N,7):0);
  const maxD=Math.max(...dist,1e-9);
  const maos=dist.map((p,k)=>barra(String(k),p,maxD,pct(p))).join('');

  $('deckAnalise').innerHTML=`
    <div class="painel">
      <h3>Curva de mana</h3>
      <p class="nota">Cartas que não são terrenos, por custo de mana. Média: ${media}${semDados?' · atualize os dados das cartas':''}</p>
      ${curva}
    </div>
    <div class="painel">
      <h3>Distribuição de cores</h3>
      <p class="nota">Símbolos de cor nos custos do deck</p>
      ${cores}
    </div>
    <div class="painel">
      <h3>Chance de terreno na mão</h3>
      <p class="nota">Primeiro a jogar, com ${L} terrenos em ${N} cartas</p>
      <div class="resumo-odds">
        <span>Mão inicial: <b>${pct(peloMenosUm(7))}</b></span>
        <span>Até o turno 2: <b>${pct(peloMenosUm(8))}</b></span>
        <span>Até o turno 3: <b>${pct(peloMenosUm(9))}</b></span>
      </div>
      <p class="nota">Quantos terrenos há na mão inicial</p>
      ${maos}
    </div>`;
}

async function atualizarDadosDeck(){
  const d=deckAtual(); if(!d) return;
  for(let i=0;i<d.cartas.length;i++){
    const c=d.cartas[i];
    $('deckMsg').textContent=`Atualizando ${i+1} de ${d.cartas.length}: ${c.nome}`;
    const info=await buscarCartaScry(c.nome);
    await pausa(110);
    if(info) Object.assign(c,info);
  }
  salvarDecks(); renderDeck();
  $('deckMsg').textContent='Dados atualizados.';
}
$('btnAtualizarDados').addEventListener('click',atualizarDadosDeck);

/* ---------- Imagens das cartas e pré-visualização ---------- */
let visaoDeck='lista';
const urlCarta=(nome,versao)=>`https://api.scryfall.com/cards/named?exact=${encodeURIComponent(nome)}&format=image&version=${versao}`;

function posicionarPreview(e){
  const p=$('preview'), w=260, h=372;
  let x=e.clientX+18;
  if(x+w>innerWidth-8) x=e.clientX-w-18;
  const y=Math.max(8,Math.min(innerHeight-h-8,e.clientY-h/2));
  p.style.left=Math.max(8,x)+'px';
  p.style.top=y+'px';
}
$('deckCartas').addEventListener('mouseover',e=>{
  const img=e.target.closest('[data-nome]'); if(!img) return;
  $('previewImg').src=urlCarta(img.dataset.nome,'normal');
  $('preview').hidden=false;
  posicionarPreview(e);
});
$('deckCartas').addEventListener('mousemove',e=>{
  if(!$('preview').hidden && e.target.closest('[data-nome]')) posicionarPreview(e);
});
$('deckCartas').addEventListener('mouseout',e=>{
  if(e.target.closest('[data-nome]') && !(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('[data-nome]')))
    $('preview').hidden=true;
});
$('visao').addEventListener('click',e=>{
  const b=e.target.closest('button[data-v]'); if(!b) return;
  visaoDeck=b.dataset.v;
  document.querySelectorAll('#visao button').forEach(x=>x.classList.toggle('ativo',x===b));
  renderDeck();
});

// Se a miniatura pela edição não existir, tenta pelo nome; se ainda falhar, mostra o aviso
$('grid').addEventListener('error',e=>{
  const img=e.target;
  if(img.tagName!=='IMG') return;
  if(!img.dataset.tent){ img.dataset.tent='1'; img.src=urlImagemNome(cartas.find(c=>c.en===img.alt)||{en:img.alt}); return; }
  const div=document.createElement('div');
  div.className='ph'; div.textContent='sem imagem';
  img.replaceWith(div);
},true);

// chips de cor e botões de acabamento
function escolherBotao(grupoId,inputId,v){
  $(inputId).value=v;
  document.querySelectorAll(`#${grupoId} button`).forEach(b=>b.classList.toggle('ativo',b.dataset.v===v));
  $(inputId).dispatchEvent(new Event('change'));
}
$('chips').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) escolherBotao('chips','cor',b.dataset.v); });

$('btnPrecos').addEventListener('click',atualizarPrecos);
$('grid').addEventListener('click',e=>{
  if(e.target.id==='mais'){ limite+=PAGINA; render(false); }
});
['busca','cor','tipo','formato','raridade','ed','ordem','cambio'].forEach(id=>['input','change'].forEach(ev=>$(id).addEventListener(ev,()=>render(true))));
